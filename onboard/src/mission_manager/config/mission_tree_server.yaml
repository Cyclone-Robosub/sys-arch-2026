bt_action_server:
  ros__parameters:
    action_name: "mission_tree_server" # Optional (defaults to `bt_action_server`)
    tick_frequency: 100 # Optional (defaults to 100 Hz)
    groot2_port: 1667 # Optional (defaults to 1667)
    ros_plugins_timeout: 1000  # Optional (defaults 1000 ms)

    behavior_trees:
      - behaviortree_ros2/mission_tree_files