x-common: &common
  runtime: nvidia
  network_mode: host
  shm_size: '8gb'
  volumes:
    - /tmp/argus_socket:/tmp/argus_socket
    - /etc/enctune.conf:/etc/enctune.conf 
    - /etc/nv_tegra_release:/etc/nv_tegra_release 
    - /tmp/nv_jetson_model:/tmp/nv_jetson_model 
    - /var/run/dbus:/var/run/dbus 
    - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket 
    - /var/run/docker.sock:/var/run/docker.sock 
    - /home/nano/Documents/jetson-containers/data:/data 
    - /run/user/1000/pulse:/run/user/1000/pulse
    - /run/jtop.sock:/run/jtop.sock
    - /home/nano/sys-arch-2026:/root/sys-arch-2026
  devices:
    - /dev/snd
    - /dev/bus/usb
    - /dev/i2c-0 
    - /dev/i2c-1 
    - /dev/i2c-2 
    - /dev/i2c-4 
    - /dev/i2c-5 
    - /dev/i2c-7 
    - /dev/i2c-9 
  environment:
    - PULSE_SERVER=unix:/run/user/1000/pulse/native
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics

services:
  manny_brain:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile.jazzy
    devices:
      # - /dev/serial/by-id/usb-MicroPython_Board_in_FS_mode_027d485dbf80bb5f-if00:/dev/serial/by-id/usb-MicroPython_Board_in_FS_mode_60fdf513bf90cb73-if00
      - /dev/video0
      - /dev/video1
      - /dev/video2
      - /dev/video3
    command: [
      "bash", 
      "-lc", 
      "sleep infinity"
      ]